# Пароль к БД — в Kubernetes Secret.
# ВАЖНО (это и показываем в видео): stringData мы пишем обычным текстом,
# а Kubernetes хранит его в base64 — ЭТО КОДИРОВКА, НЕ ШИФРОВАНИЕ.
# Любой, у кого есть доступ к Secret/etcd, раскодирует пароль одной командой.
# Как защищать по-настоящему — encryption-at-rest на api-server (см. слайды).
apiVersion: v1
kind: Secret
metadata:
  name: scott-db
type: Opaque
stringData:
  DB_PASSWORD: s3cr3t-pilgrim   # тот же, что POSTGRES_PASSWORD в db/docker-compose.yml
