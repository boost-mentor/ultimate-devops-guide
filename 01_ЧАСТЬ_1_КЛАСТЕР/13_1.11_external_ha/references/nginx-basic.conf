# УЧЕБНЫЙ ФАЙЛ: минимальный reverse proxy с балансировкой.
# Не используется playbook'ом — это анатомия для чтения и локального стенда.
# Комментарии отвечают на «почему», синтаксис читается сам.

# Секция events обязательна даже пустой: в ней живут настройки приёма
# соединений, и без неё nginx -t не примет файл.
events {}

http {
    # Пул backend'ов под одним внутренним именем. Алгоритм здесь не
    # написан, потому что round robin — умолчание для upstream.
    upstream devops_may_cry {
        server app1:8080;
        server app2:8080;
    }

    # Listener: единственная дверь, которую видит клиент.
    server {
        # Порт входа. Сколько backend'ов за ним — клиента не касается.
        listen 8081;

        # Один журнал на весь вход: кто пришёл и что получил — видно
        # в одной точке, каким бы backend'ом ни обслужился запрос.
        # В официальном контейнере этот путь — ссылка на stdout.
        access_log /var/log/nginx/access.log;

        # Правило для всех путей, начиная с корня.
        location / {
            # Backend должен видеть исходный Host, а не адрес proxy,
            # иначе приложение строит ссылки по чужому имени.
            proxy_set_header Host $host;

            # Настоящий адрес клиента иначе потеряется: TCP-соединение
            # к backend'у открывает сам proxy от своего имени.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Передать запрос пулу. Имя после http:// — это upstream,
            # и именно на этой строке включается балансировка.
            proxy_pass http://devops_may_cry;
        }
    }
}
