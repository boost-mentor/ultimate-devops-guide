# УЧЕБНЫЙ ФАЙЛ: один HAProxy перед двумя backend'ами.
# Не используется playbook'ом — анатомия для чтения и локального стенда.
# Комментарии отвечают на «почему», синтаксис читается сам.

global
    # Журнал в stdout: в контейнере и под systemd его подберёт штатный
    # сборщик логов, файл внутри процесса не нужен.
    log stdout format raw local0
    # daemon здесь не пишем: за перезапуски отвечает супервизор
    # (контейнер или systemd), а не двойной fork самого процесса.

defaults
    log global
    # HTTP-режим: проксируем запросы, а не сырые TCP-байты, поэтому в
    # журнале видны метод, путь и код ответа каждого запроса.
    mode http
    # Таймауты обязательны: без них зависший backend держал бы
    # соединения бесконечно.
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# Frontend — дверь для клиентов: где слушаем и кому отдаём.
frontend http_in
    bind *:8082
    default_backend app_nodes

# Backend — пул, между которым распределяем работу.
backend app_nodes
    # Новые запросы по кругу: честно по количеству, когда backend'ы
    # одинаковы и запросы сравнимой стоимости.
    balance roundrobin
    # Active-проверка: HAProxy сам спрашивает /readyz, не дожидаясь,
    # пока об умерший backend споткнётся живой клиент.
    option httpchk GET /readyz
    # check включает проверку, а inter/fall/rise делают тайминги
    # видимыми: 2s × 3 неудачи ≈ 6 секунд до пометки DOWN.
    server app1 app1:8080 check inter 2s fall 3 rise 2
    server app2 app2:8080 check inter 2s fall 3 rise 2

# Служебная страница состояния. Наружу не публикуется: в лаборатории
# на VM она привязана к 127.0.0.1 и открывается через SSH-туннель.
listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 2s
