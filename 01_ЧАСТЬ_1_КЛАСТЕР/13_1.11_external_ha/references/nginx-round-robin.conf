# REFERENCE ONLY. The Ansible playbook does not install this file.
upstream devops_may_cry_nodeports {
    # Round robin is the default upstream algorithm.
    server 10.10.0.11:30080 max_fails=3 fail_timeout=10s;
    server 10.10.0.12:30080 max_fails=3 fail_timeout=10s;
    server 10.10.0.13:30080 max_fails=3 fail_timeout=10s;
}

server {
    listen 8080;

    location / {
        proxy_pass http://devops_may_cry_nodeports;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
