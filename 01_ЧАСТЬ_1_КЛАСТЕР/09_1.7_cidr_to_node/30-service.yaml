apiVersion: v1
kind: Service
metadata:
  name: calico-b
  namespace: network-proof
spec:
  # Selector связывает постоянное имя Service с Pod, у которого есть
  # метка endpoint=calico-b. Если Pod пересоздать, его IP изменится,
  # а Service и DNS-имя останутся прежними.
  selector:
    endpoint: calico-b
  ports:
    - name: http
      port: 80
      targetPort: http
