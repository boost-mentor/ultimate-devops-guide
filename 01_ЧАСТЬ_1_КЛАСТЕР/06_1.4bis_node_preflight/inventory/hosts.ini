# Public example only. The generated runtime inventory with real addresses is
# ignored by Git and must not be shown in the recording.
[all]
node1 ansible_host=__NODE1_PUBLIC_IP__
node2 ansible_host=__NODE2_PUBLIC_IP__
node3 ansible_host=__NODE3_PUBLIC_IP__

[kube_control_plane]
node1
node2

[etcd]
node1
node2
node3

[kube_node]
node2
node3

[k8s_cluster:children]
kube_control_plane
kube_node

[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
