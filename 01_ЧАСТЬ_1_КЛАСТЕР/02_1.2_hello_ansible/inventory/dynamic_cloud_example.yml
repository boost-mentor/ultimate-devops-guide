---
# СПРАВОЧНИК: так выглядит ДИНАМИЧЕСКИЙ inventory (в лабораторной не подключён).
# Static-файл вроде hosts.ini правится руками и устаревает, как только облако
# создало или убило машину. Динамический inventory — это плагин, который при
# КАЖДОМ запуске ansible/ansible-playbook спрашивает API облака и строит список
# машин на лету. Пример для AWS (плагин amazon.aws.aws_ec2; у Яндекс.Облака и
# других провайдеров — свои аналогичные плагины):
#
# plugin: amazon.aws.aws_ec2          # имя inventory-плагина
# regions:
#   - eu-central-1                    # где искать машины
# filters:
#   tag:project: devops-may-cry       # берём только машины нашего проекта
# keyed_groups:
#   - key: tags.role                  # тег role=worker превращается
#     prefix: role                    #   в группу role_worker
#
# Запуск тот же самый: ansible-inventory -i inventory/aws_ec2.yml --graph
# покажет живые машины, сгруппированные по тегам, — файл со списком адресов
# больше никто не правит руками: источник истины — API провайдера.
