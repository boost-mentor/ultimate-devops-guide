[defaults]
# Эти относительные пути позволяют запускать команды из корня лабораторной.
inventory = inventory/hosts.ini
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = false
stdout_callback = default
display_skipped_hosts = false

[privilege_escalation]
# Локальная лаборатория не меняет системные файлы и не требует sudo.
become = false
